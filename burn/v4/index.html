<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>온열제품 V4 · 온도 게이지 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../common.css">
<style>
.hdefs{position:absolute;width:0;height:0;overflow:hidden}
.ctximg{position:relative}
.ctximg img{width:100%}
.ctximg span{position:absolute;top:8px;right:10px;font-size:10.5px;font-weight:600;color:#8A8A8A;background:rgba(255,255,255,.9);padding:2px 8px;border-radius:99px;letter-spacing:.02em}
.scn{display:block;width:100%;height:auto}
.scn text{font-family:'Pretendard Variable',Pretendard,sans-serif}

.scn .s-pt{opacity:0}
.play .s-pt{animation:s-pt 1.5s linear infinite}
@keyframes s-pt{0%{transform:translateX(0);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(-18px);opacity:0}}
.scn .s-burn,.scn .s-eglow,.scn .s-red,.scn .s-tb,.scn .s-cool,.scn .s-tk{opacity:0}
.scn .s-bl{transform-box:fill-box;transform-origin:0 50%;transform:scale(0)}
.play .s-burn,.play .s-red{animation:s-burn 6.5s ease-in-out infinite}
.play .s-eglow{animation:s-eglow 6.5s ease-in-out infinite}
.play .s-bl{animation:s-bl 6.5s ease-out infinite}
.play .s-tb{animation:s-tb 6.5s ease infinite}
.play .s-cool,.play .s-tk{animation:s-tk 6.5s ease infinite}
.scn .s-pg{opacity:.5}
.play .s-pg{animation:s-pg 1.6s ease-in-out infinite}
.play .s-wv{animation:s-wv 2.2s ease-in-out infinite}
@keyframes s-burn{0%,10%{opacity:0}40%,88%{opacity:1}100%{opacity:0}}
@keyframes s-eglow{0%,15%{opacity:0}42%{opacity:.8}52%{opacity:.5}62%{opacity:.8}88%{opacity:.6}100%{opacity:0}}
@keyframes s-bl{0%,30%{transform:scale(0);opacity:1}42%{transform:scale(1.15)}48%,90%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes s-tb{0%,44%{opacity:0;transform:translateY(6px)}52%,90%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes s-tk{0%,58%{opacity:0}68%,90%{opacity:1}100%{opacity:0}}
@keyframes s-pg{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes s-wv{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

.v4{background:#111;color:#fff;padding:86px 0 78px}
.v4 .hd{text-align:center;padding:0 20px}
.v4 .sub{display:block;font-size:20px;font-weight:300;color:rgba(255,255,255,.66);line-height:1.5}
.v4 h2{margin-top:6px;font-size:38px;font-weight:800;letter-spacing:-.045em;line-height:1.2}
.v4 .bt{margin-top:26px;font-size:17px;line-height:1.8;color:rgba(255,255,255,.62);letter-spacing:-.025em}
.v4 .bt b{color:#fff;font-weight:700}
.v4 .fig{margin-top:42px}
.v4 .pf-clip{transform-box:fill-box;transform-origin:100% 50%;transform:scaleX(.15)}
.v4 .play .pf-clip{animation:v4clip 6.5s ease-in-out infinite}
@keyframes v4clip{0%,6%{transform:scaleX(.15)}40%,90%{transform:scaleX(.62)}100%{transform:scaleX(.15)}}
.v4 .pf-cold{opacity:.25}
.v4 .play .pf-cold{animation:s-tk 6.5s ease infinite}
.v4 .gg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 20px 0}
.v4 .gc{background:#1C1C1C;border-radius:20px;padding:22px 12px 20px;text-align:center;border:1px solid rgba(255,255,255,.06)}
.v4 .gc small{display:block;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:.04em}
.v4 .th{position:relative;width:34px;height:176px;margin:16px auto 0}
.v4 .th .tube{position:absolute;left:8px;top:0;width:18px;height:150px;border-radius:9px;background:#2C2C2C;overflow:hidden;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
.v4 .th .fill{position:absolute;left:0;right:0;bottom:0;height:100%;transform-origin:50% 100%;border-radius:9px}
.v4 .th .bulb{position:absolute;left:0;bottom:0;width:34px;height:34px;border-radius:50%}
.v4 .th .tick{position:absolute;left:30px;width:8px;height:1.5px;background:rgba(255,255,255,.2)}
.v4 .hot .fill{background:linear-gradient(to top,#FF8A4C,#E8484F 60%,#C9262F);transform:scaleY(.12)}
.v4 .hot .bulb{background:radial-gradient(circle at 35% 35%,#FFB08A,#E8484F 55%,#B8323F)}
.v4 .cold .fill{background:linear-gradient(to top,#8FB3D6,#6F98C4);transform:scaleY(.12)}
.v4 .cold .bulb{background:radial-gradient(circle at 35% 35%,#D5E6F5,#8FB3D6 55%,#5F8DBE)}
.v4 .hot .zone{position:absolute;left:8px;top:0;width:18px;height:34px;border-radius:9px 9px 0 0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 3px,transparent 3px 7px)}
.v4 .play .hot .fill{animation:v4hot 6.5s ease-in-out infinite}
.v4 .play .cold .fill{animation:v4cold 6.5s ease-in-out infinite}
.v4 .play .hot .bulb{animation:v4bulb 6.5s ease-in-out infinite}
@keyframes v4hot{0%,6%{transform:scaleY(.12)}42%,90%{transform:scaleY(.97)}100%{transform:scaleY(.12)}}
@keyframes v4cold{0%,30%{transform:scaleY(.12)}45%{transform:scaleY(.16)}60%,100%{transform:scaleY(.12)}}
@keyframes v4bulb{0%,30%{box-shadow:0 0 0 0 rgba(255,74,58,0)}50%,88%{box-shadow:0 0 22px 4px rgba(255,74,58,.55)}100%{box-shadow:0 0 0 0 rgba(255,74,58,0)}}
.v4 .gc strong{display:block;margin-top:14px;font-size:17px;font-weight:800;letter-spacing:-.03em;color:#fff;opacity:.3}
.v4 .play .hot strong{animation:v4t1 6.5s ease infinite}
.v4 .play .cold strong{animation:v4t2 6.5s ease infinite}
@keyframes v4t1{0%,44%{opacity:.3}52%,90%{opacity:1}100%{opacity:.3}}
@keyframes v4t2{0%,58%{opacity:.3}68%,90%{opacity:1}100%{opacity:.3}}
.v4 .end{margin-top:56px;padding:0 20px;text-align:center;font-size:21px;font-weight:300;line-height:1.65;letter-spacing:-.02em;color:rgba(255,255,255,.88)}
.v4 .end strong{font-weight:800;color:#fff}
</style>
