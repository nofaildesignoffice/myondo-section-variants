<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사용 기간 V5 · 제품 사진 오버레이</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../common.css">
<style>
:root{--brand:#6B1530;--brand2:#8A2A45;--ink:#24141A;--dark:#4A3A40;--gray:#7A6C71;--light:#A89BA0;--line:#EADFE2;--soft:#F7F4F4}
.ctx-lab{font-size:11px;color:#A89BA0;background:#F1EEEF;padding:7px 20px;letter-spacing:.02em}
.ctx-img{width:100%;display:block}
section.life{padding:76px 20px 52px;background:#fff;text-align:center;overflow:hidden}
.st{font-size:34px;font-weight:400;line-height:1.3;letter-spacing:-.03em;margin-bottom:10px;color:var(--ink)}
.st strong{font-weight:800}
.ss{font-size:14px;color:var(--gray);line-height:1.6;margin-bottom:28px}
.nt{font-size:11.5px;color:var(--light);line-height:1.55;margin-top:12px;text-align:center}
b{color:#111}


.v5-hero{position:relative;margin:4px -20px 0;height:430px;overflow:hidden;background:#1b1517}
.v5-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;transform:scale(1.12);transition:transform 3.2s cubic-bezier(.22,1,.36,1)}
.v5-hero.in img{transform:scale(1)}
.v5-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,12,15,0) 28%,rgba(20,12,15,.55) 56%,rgba(20,12,15,.92) 100%)}
.v5-ov{position:absolute;left:20px;right:20px;bottom:24px;z-index:1;display:grid;grid-template-columns:1fr 1fr;text-align:left;color:#fff}
.v5-ov>div{padding:0 4px 0 0}
.v5-ov>div+div{border-left:1px solid rgba(255,255,255,.28);padding-left:18px}
.v5-ov h3{font-size:13px;font-weight:600;color:rgba(255,255,255,.78)}
.v5-ov p{margin-top:4px;display:flex;align-items:baseline;gap:3px;line-height:1.1}
.v5-ov p small{font-size:14px;font-weight:600;color:rgba(255,255,255,.85)}
.v5-ov p strong{font-size:44px;font-weight:800;letter-spacing:-.04em}
.v5-ov p span{font-size:18px;font-weight:700}
.v5-ln{margin-top:12px;height:3px;border-radius:2px;background:rgba(255,255,255,.2);position:relative;overflow:hidden}
.v5-ln i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform 1.6s cubic-bezier(.22,1,.36,1) .5s}
.v5-ln i::after{content:"";position:absolute;right:0;top:-3px;width:9px;height:9px;margin-right:-4px;border-radius:50%;background:#C24A73;box-shadow:0 0 0 3px rgba(194,74,115,.3)}
.v5-hero.in .v5-ln i{transform:scaleX(1)}
.v5-ax{margin-top:5px;display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.5)}
.v5-msg{margin-top:26px;display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center;text-align:left}
.v5-msg .th{width:92px;height:92px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.v5-msg .th img{width:84px}
.v5-msg p{font-size:13.5px;color:var(--dark);line-height:1.7}

</style>
</head>
<body>
<div class="tag">사용 기간 V5 · 제품 사진 오버레이</div>
<div class="ctx-lab">이전 섹션</div>
<img class="ctx-img" src="../ctx_prev.jpg" alt="이전 섹션 미리보기">

<section class="life">
  <h2 class="st rv">고장은 없지만,<br><strong>오래 쓰면 닳아요</strong></h2>
  <p class="ss rv">전원이 없는 밴드라 고장 날 곳은 없어요.<br>다만 옷처럼, 도트가 조금씩 닳습니다.</p>
  <div class="v5-hero rv">
    <img src="../../img/dot_macro.jpg" alt="밴드 안쪽 도트 면을 가까이서 본 모습">
    <div class="v5-ov">
      <div><h3>매일 자주 착용</h3><p><small>약</small><strong>2</strong><span>년</span></p><div class="v5-ln"><i style="width:40%"></i></div><div class="v5-ax"><span>0</span><span>5년</span></div></div>
      <div><h3>가끔 착용</h3><p><small>최대</small><strong>5</strong><span>년</span></p><div class="v5-ln"><i style="width:100%"></i></div><div class="v5-ax"><span>0</span><span>5년</span></div></div>
    </div>
  </div>
  <div class="v5-msg rv"><span class="th"><img src="../../img/nukki.png" alt="마이온도 밴드"></span><p>도트가 닳으면 온기가 줄어들 수 있어요. 매일 쓰신다면 <b>2년쯤 뒤 재구매</b>를 권하고, 도트가 손상된 것 같다면 고객센터로 문의해 주세요.</p></div>
  <p class="nt">사용 기간은 브랜드 안내 기준이며, 사용 빈도와 관리 상태에 따라 다릅니다.</p>
</section>

<div class="ctx-lab">다음 섹션</div>
<img class="ctx-img" src="../ctx_next.jpg" alt="다음 섹션 미리보기">
<script src="../../common.js"></script>

</body>
</html>
