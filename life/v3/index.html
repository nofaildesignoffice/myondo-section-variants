<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사용 기간 V3 · 도트 마모 시뮬레이션</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../common.css">
<style>
:root{--brand:#6B1530;--brand2:#8A2A45;--ink:#24141A;--dark:#4A3A40;--gray:#7A6C71;--light:#A89BA0;--line:#EADFE2;--soft:#F7F4F4}
.ctx-lab{font-size:11px;color:#A89BA0;background:#F1EEEF;padding:7px 20px;letter-spacing:.02em}
.ctx-img{width:100%;display:block}
section.life{padding:76px 20px 52px;background:#fff;text-align:center;overflow:hidden}
.st{font-size:34px;font-weight:400;line-height:1.3;letter-spacing:-.03em;margin-bottom:10px;color:var(--ink)}
.st strong{font-weight:800}
.ss{font-size:14px;color:var(--gray);line-height:1.6;margin-bottom:28px}
.nt{font-size:11.5px;color:var(--light);line-height:1.55;margin-top:12px;text-align:center}
b{color:#111}


.v3-photo{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:2/1;background:#1b1517}
.v3-photo img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 2.4s cubic-bezier(.22,1,.36,1)}
.v3-photo.in img{transform:scale(1)}
.v3-sim{margin-top:22px;background:var(--soft);border-radius:18px;padding:20px 16px 18px;text-align:left}
.v3-top{display:flex;align-items:flex-end;justify-content:space-between}
.v3-yr{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.v3-yr small{font-size:16px;font-weight:700;margin-left:2px}
.v3-replay{display:flex;align-items:center;gap:5px;border:1px solid #D9CFD3;background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;color:var(--dark);cursor:pointer}
.v3-replay svg{width:14px;height:14px}
.v3-range{width:100%;margin:14px 0 2px;accent-color:#6B1530;height:20px}
.v3-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--light)}
.v3-strip{margin-top:16px}
.v3-strip h3{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.v3-strip h3 em{font-style:normal;font-size:13px;font-weight:800;color:#fff;background:#24141A;border-radius:99px;padding:3px 11px;opacity:0;transform:translateY(4px);transition:.4s}
.v3-strip.done h3 em{opacity:1;transform:none}
.v3-band{margin-top:8px;background:#1E191B;border-radius:12px;padding:12px 12px;display:grid;grid-template-columns:repeat(18,1fr);gap:7px 0;justify-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.v3-band i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#C24A73,#8A2A45 70%);will-change:opacity}
.v3-band i:nth-child(36n+19),.v3-band i:nth-child(36n+20),.v3-band i:nth-child(36n+21),.v3-band i:nth-child(36n+22),.v3-band i:nth-child(36n+23),.v3-band i:nth-child(36n+24),.v3-band i:nth-child(36n+25),.v3-band i:nth-child(36n+26),.v3-band i:nth-child(36n+27),.v3-band i:nth-child(36n+28),.v3-band i:nth-child(36n+29),.v3-band i:nth-child(36n+30),.v3-band i:nth-child(36n+31),.v3-band i:nth-child(36n+32),.v3-band i:nth-child(36n+33),.v3-band i:nth-child(36n+34),.v3-band i:nth-child(36n+35),.v3-band i:nth-child(36n+36){transform:translateX(50%)}
.v3-msg{margin-top:24px;font-size:14px;color:var(--dark);line-height:1.75;text-align:left;padding:0 2px}

</style>
</head>
<body>
<div class="tag">사용 기간 V3 · 도트 마모 시뮬레이션</div>
<div class="ctx-lab">이전 섹션</div>
<img class="ctx-img" src="../ctx_prev.jpg" alt="이전 섹션 미리보기">

<section class="life">
  <h2 class="st rv">고장은 없지만,<br><strong>오래 쓰면 닳아요</strong></h2>
  <p class="ss rv">전원이 없는 밴드라 고장 날 곳은 없어요.<br>다만 옷처럼, 도트가 조금씩 닳습니다.</p>
  <div class="v3-photo rv"><img src="../../img/dot_flat.jpg" alt="마이온도 밴드 안쪽의 도트 면"></div>
  <div class="v3-sim rv" id="v3sim">
    <div class="v3-top"><div class="v3-yr"><span id="v3y">0.0</span><small>년</small></div><button class="v3-replay" id="v3btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="#6B1530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>다시 보기</button></div>
    <input class="v3-range" id="v3r" type="range" min="0" max="5" step="0.05" value="0" aria-label="사용 기간">
    <div class="v3-ax"><span>0</span><span>1년</span><span>2년</span><span>3년</span><span>4년</span><span>5년</span></div>
    <div class="v3-strip" data-life="2"><h3>매일 자주 착용<em>약 2년</em></h3><div class="v3-band"></div></div>
    <div class="v3-strip" data-life="5"><h3>가끔 착용<em>최대 5년</em></h3><div class="v3-band"></div></div>
  </div>
  <p class="v3-msg rv">도트가 닳으면 온기가 줄어들 수 있어요. 매일 쓰신다면 <b>2년쯤 뒤 재구매</b>를 권하고, 도트가 손상된 것 같다면 고객센터로 문의해 주세요.</p>
  <p class="nt">사용 기간은 브랜드 안내 기준이며, 사용 빈도와 관리 상태에 따라 다릅니다.</p>
</section>

<div class="ctx-lab">다음 섹션</div>
<img class="ctx-img" src="../ctx_next.jpg" alt="다음 섹션 미리보기">
<script src="../../common.js"></script>
<script>
(function(){
  var sim=document.getElementById('v3sim'),yEl=document.getElementById('v3y'),rng=document.getElementById('v3r'),btn=document.getElementById('v3btn');
  var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
  var strips=[].map.call(document.querySelectorAll('.v3-strip'),function(s){
    var band=s.querySelector('.v3-band'),dots=[];
    for(var k=0;k<72;k++){var i=document.createElement('i');i._r=rnd();band.appendChild(i);dots.push(i)}
    return {el:s,life:+s.dataset.life,dots:dots};
  });
  function set(t){
    yEl.textContent=t.toFixed(1);rng.value=t;
    strips.forEach(function(s){
      var w=Math.min(t/s.life,1);
      s.dots.forEach(function(d){var f=Math.max(0,Math.min(1,(w-.35-d._r*.45)/.2));d.style.opacity=(1-.72*f).toFixed(3);d.style.filter='saturate('+(1-.6*f).toFixed(2)+')'});
      s.el.classList.toggle('done',t>=s.life-.001);
    });
  }
  var raf,start;
  function play(){cancelAnimationFrame(raf);start=null;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){set(5);return}
    function step(ts){if(!start)start=ts;var t=Math.min((ts-start)/1100,5);set(t);if(t<5)raf=requestAnimationFrame(step)}
    raf=requestAnimationFrame(step)}
  set(0);
  var io=new IntersectionObserver(function(es){if(es[0].isIntersecting){play();io.disconnect()}},{threshold:.45});io.observe(sim);
  btn.addEventListener('click',play);
  rng.addEventListener('input',function(){cancelAnimationFrame(raf);set(+rng.value)});
  window.__v3final=function(){cancelAnimationFrame(raf);set(2)};
})();
</script>
</body>
</html>
