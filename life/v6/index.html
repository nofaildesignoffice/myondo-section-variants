<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사용 기간 V6 · 미니멀 타이포그래피</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../common.css">
<style>
:root{--brand:#6B1530;--brand2:#8A2A45;--ink:#24141A;--dark:#4A3A40;--gray:#7A6C71;--light:#A89BA0;--line:#EADFE2;--soft:#F7F4F4}
.ctx-lab{font-size:11px;color:#A89BA0;background:#F1EEEF;padding:7px 20px;letter-spacing:.02em}
.ctx-img{width:100%;display:block}
section.life{padding:76px 20px 52px;background:#fff;text-align:center;overflow:hidden}
.st{font-size:34px;font-weight:400;line-height:1.3;letter-spacing:-.03em;margin-bottom:10px;color:var(--ink)}
.st strong{font-weight:800}
.ss{font-size:14px;color:var(--gray);line-height:1.6;margin-bottom:28px}
.nt{font-size:11.5px;color:var(--light);line-height:1.55;margin-top:12px;text-align:center}
b{color:#111}


section.life{text-align:left;padding-left:24px;padding-right:24px}
.v6-k{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--gray);margin-bottom:14px}
.v6-k::before{content:"";display:inline-block;width:18px;height:1.5px;background:var(--brand);vertical-align:middle;margin-right:8px}
.v6-row{border-top:1px solid #24141A;padding:18px 0 22px;margin-top:0}
.v6-row+.v6-row{border-top-color:var(--line)}
.v6-rh{display:flex;justify-content:space-between;align-items:baseline}
.v6-rh h3{font-size:15px;font-weight:700;color:var(--ink)}
.v6-rh span{font-size:12px;color:var(--light)}
.v6-n{margin-top:6px;display:flex;align-items:baseline;line-height:1;color:var(--ink)}
.v6-n small{font-size:18px;font-weight:500;margin-right:8px;color:var(--gray)}
.v6-n strong{font-size:96px;font-weight:200;letter-spacing:-.06em}
.v6-n em{font-style:normal;font-size:24px;font-weight:500;margin-left:6px}
.v6-ru{position:relative;margin-top:16px;height:14px}
.v6-ru::before{content:"";position:absolute;left:0;right:0;top:6px;height:1px;background:#E2D9DC}
.v6-ru b{position:absolute;left:0;top:5px;height:3px;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform 1.5s cubic-bezier(.22,1,.36,1) .3s}
.v6-ru u{position:absolute;top:2px;width:1px;height:10px;background:#CFC4C8}
.v6-row.in .v6-ru b{transform:scaleX(1)}
.v6-ax{position:relative;height:16px;font-size:10.5px;color:var(--light)}
.v6-ax span{position:absolute;transform:translateX(-50%)}
.v6-ax span:first-child{transform:none}.v6-ax span:last-child{transform:translateX(-100%)}
.v6-msg{margin-top:30px;font-size:17px;font-weight:400;color:var(--ink);line-height:1.7;letter-spacing:-.02em}
.v6-msg b{font-weight:800}
.v6-end{margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
.v6-end .nt{text-align:left;margin-top:0}

</style>
</head>
<body>
<div class="tag">사용 기간 V6 · 미니멀 타이포그래피</div>
<div class="ctx-lab">이전 섹션</div>
<img class="ctx-img" src="../ctx_prev.jpg" alt="이전 섹션 미리보기">

<section class="life">
  <p class="v6-k rv">LIFESPAN</p>
  <h2 class="st rv" style="text-align:left">고장은 없지만,<br><strong>오래 쓰면 닳아요</strong></h2>
  <p class="ss rv" style="margin-bottom:36px">전원이 없는 밴드라 고장 날 곳은 없어요.<br>다만 옷처럼, 도트가 조금씩 닳습니다.</p>
  <div class="v6-row rv"><div class="v6-rh"><h3>매일 자주 착용</h3><span>01</span></div>
    <div class="v6-n"><small>약</small><strong>2</strong><em>년</em></div>
    <div class="v6-ru"><u style="left:0%"></u><u style="left:20%"></u><u style="left:40%"></u><u style="left:60%"></u><u style="left:80%"></u><u style="left:100%;margin-left:-1px"></u><b style="width:40%"></b></div><div class="v6-ax"><span style="left:0%">0</span><span style="left:20%">1년</span><span style="left:40%">2년</span><span style="left:60%">3년</span><span style="left:80%">4년</span><span style="left:100%">5년</span></div></div>
  <div class="v6-row rv"><div class="v6-rh"><h3>가끔 착용</h3><span>02</span></div>
    <div class="v6-n"><small>최대</small><strong>5</strong><em>년</em></div>
    <div class="v6-ru"><u style="left:0%"></u><u style="left:20%"></u><u style="left:40%"></u><u style="left:60%"></u><u style="left:80%"></u><u style="left:100%;margin-left:-1px"></u><b style="width:100%"></b></div><div class="v6-ax"><span style="left:0%">0</span><span style="left:20%">1년</span><span style="left:40%">2년</span><span style="left:60%">3년</span><span style="left:80%">4년</span><span style="left:100%">5년</span></div></div>
  <p class="v6-msg rv">도트가 닳으면 온기가 줄어들 수 있어요. 매일 쓰신다면 <b>2년쯤 뒤 재구매</b>를 권하고, 도트가 손상된 것 같다면 고객센터로 문의해 주세요.</p>
  <div class="v6-end"><p class="nt">사용 기간은 브랜드 안내 기준이며, 사용 빈도와 관리 상태에 따라 다릅니다.</p></div>
</section>

<div class="ctx-lab">다음 섹션</div>
<img class="ctx-img" src="../ctx_next.jpg" alt="다음 섹션 미리보기">
<script src="../../common.js"></script>

</body>
</html>
