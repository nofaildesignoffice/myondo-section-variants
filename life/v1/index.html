<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사용 기간 V1 · 정제된 막대 그래프</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../../common.css">
<style>
:root{--brand:#6B1530;--brand2:#8A2A45;--ink:#24141A;--dark:#4A3A40;--gray:#7A6C71;--light:#A89BA0;--line:#EADFE2;--soft:#F7F4F4}
.ctx-lab{font-size:11px;color:#A89BA0;background:#F1EEEF;padding:7px 20px;letter-spacing:.02em}
.ctx-img{width:100%;display:block}
section.life{padding:76px 20px 52px;background:#fff;text-align:center;overflow:hidden}
.st{font-size:34px;font-weight:400;line-height:1.3;letter-spacing:-.03em;margin-bottom:10px;color:var(--ink)}
.st strong{font-weight:800}
.ss{font-size:14px;color:var(--gray);line-height:1.6;margin-bottom:28px}
.nt{font-size:11.5px;color:var(--light);line-height:1.55;margin-top:12px;text-align:center}
b{color:#111}


.v1-chart{position:relative;margin-top:4px;padding:6px 0 0;text-align:left}
.v1-grid{position:absolute;left:0;right:0;top:0;bottom:22px;pointer-events:none}
.v1-grid i{position:absolute;top:0;bottom:0;width:1px;background:#EFE9EB}
.v1-mark{position:absolute;top:-22px;bottom:22px;left:40%;width:0;border-left:1.5px dashed var(--brand);opacity:0;transition:opacity .6s ease 1.6s}
.v1-mark span{position:absolute;top:0;left:6px;white-space:nowrap;font-size:11px;font-weight:700;color:var(--dark)}
.v1-row{position:relative;padding:14px 0 6px}
.v1-row h3{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.v1-row h3 svg{width:18px;height:18px;flex:none}
.v1-track{margin-top:10px;height:34px;border-radius:10px;background:#F1ECEE;overflow:hidden;position:relative}
.v1-fill{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:linear-gradient(90deg,#9A3456,var(--brand));transform:scaleX(0);transform-origin:left;transition:transform 1.4s cubic-bezier(.22,1,.36,1)}
.v1-fill em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:14px;font-weight:800;color:#fff;letter-spacing:-.01em;opacity:0;transition:opacity .5s ease}
.v1-row:nth-of-type(2) .v1-fill{transition-delay:.15s}
.v1-row:nth-of-type(3) .v1-fill{transition-delay:.45s;transition-duration:2s}
.v1-chart.in .v1-fill{transform:scaleX(1)}
.v1-chart.in .v1-row:nth-of-type(2) em{opacity:1;transition-delay:1.3s}
.v1-chart.in .v1-row:nth-of-type(3) em{opacity:1;transition-delay:2.2s}
.v1-chart.in .v1-mark{opacity:1}
.v1-ax{position:relative;height:22px;margin-top:6px;font-size:11px;color:var(--light)}
.v1-ax span{position:absolute;top:2px;transform:translateX(-50%)}
.v1-ax span:first-child{transform:none}.v1-ax span:last-child{transform:translateX(-100%)}
.v1-ax span.on{color:var(--ink);font-weight:700}
.v1-msg{margin-top:30px;display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:16px;padding:18px 18px;text-align:left}
.v1-msg svg{width:22px;height:22px;flex:none;margin-top:1px}
.v1-msg p{font-size:13.5px;color:var(--dark);line-height:1.7}

</style>
</head>
<body>
<div class="tag">사용 기간 V1 · 정제된 막대 그래프</div>
<div class="ctx-lab">이전 섹션</div>
<img class="ctx-img" src="../ctx_prev.jpg" alt="이전 섹션 미리보기">

<section class="life">
  <h2 class="st rv">고장은 없지만,<br><strong>오래 쓰면 닳아요</strong></h2>
  <p class="ss rv">전원이 없는 밴드라 고장 날 곳은 없어요.<br>다만 옷처럼, 도트가 조금씩 닳습니다.</p>
  <div class="v1-chart rv">
    <div class="v1-grid"><i style="left:0"></i><i style="left:20%"></i><i style="left:40%"></i><i style="left:60%"></i><i style="left:80%"></i><i style="left:calc(100% - 1px)"></i></div>
    <div class="v1-mark"><span>재구매 권장</span></div>
    <div class="v1-row"><h3><svg viewBox="0 0 24 24" fill="none" stroke="#6B1530" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M7.5 13.5h2M11 13.5h2M14.5 13.5h2M7.5 16.5h2M11 16.5h2M14.5 16.5h2"/></svg>매일 자주 착용</h3><div class="v1-track"><i class="v1-fill" style="width:40%"><em>약 2년</em></i></div></div>
    <div class="v1-row"><h3><svg viewBox="0 0 24 24" fill="none" stroke="#6B1530" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 15h2"/></svg>가끔 착용</h3><div class="v1-track"><i class="v1-fill" style="width:100%"><em>최대 5년</em></i></div></div>
    <div class="v1-ax"><span style="left:0">0</span><span style="left:20%">1년</span><span class="on" style="left:40%">2년</span><span style="left:60%">3년</span><span style="left:80%">4년</span><span style="left:100%">5년</span></div>
  </div>
  <div class="v1-msg rv"><svg viewBox="0 0 24 24" fill="none" stroke="#6B1530" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3 2"/></svg><p>도트가 닳으면 온기가 줄어들 수 있어요. 매일 쓰신다면 <b>2년쯤 뒤 재구매</b>를 권하고, 도트가 손상된 것 같다면 고객센터로 문의해 주세요.</p></div>
  <p class="nt">사용 기간은 브랜드 안내 기준이며, 사용 빈도와 관리 상태에 따라 다릅니다.</p>
</section>

<div class="ctx-lab">다음 섹션</div>
<img class="ctx-img" src="../ctx_next.jpg" alt="다음 섹션 미리보기">
<script src="../../common.js"></script>

</body>
</html>
